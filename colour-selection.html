            <h3>Enter Key</h3>
            <input

                class="key-input" 
                id="keyInput" 
                placeholder="Enter key" 
                autocomplete="off"
            >
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" id="keyModalCancel">Cancel</button>
                <button class="btn-modal btn-confirm" id="keyModalConfirm">OK</button>
